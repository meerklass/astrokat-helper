durations:
  start_time: 2024-07-02 17:20:00     # This is the start time so that you can test these on using astrokat
  # start_time: 2024-07-02 18:40:00     # This is the start time so that you can test these on using astrokat
instrument:
  integration_time: 2
# set noise diode pattern to fire every 20 seconds and only be on for 0.6s

noise_diode:
  antennas: all
  cycle_len: 19.5   # The maximum time a is 20 seconds
  on_frac: 0.030    # the time  the noise diode is on =  cycle_len* on_frac
  lead_time: 12.   #  do not change

scan:
  # achieving a scan speed of 8.0 arcmin/sec on sky.
  scan_speed: 7.0
  direction: 0  #  do not change
  radec_p1: 12:16:00.00, -08:00:00.00   # Note the comma separation.
  radec_p2: 13:24:00.00, -08:00:00.00   # Note the comma separation.
  radec_p3: 13:24:00.00, 05:30:00.00    # Note the comma separation.
  radec_p4: 12:16:00.00, 05:30:00.00    # Note the comma separation.
  projection: plate-carree  #  do not change

horizon: 15
